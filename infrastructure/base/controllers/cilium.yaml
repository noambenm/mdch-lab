---
apiVersion: v1
kind: Namespace
metadata:
  name: cilium
  labels:
    app.kubernetes.io/component: cilium
---
apiVersion: source.toolkit.fluxcd.io/v1
kind: OCIRepository
metadata:
  name: cilium
  namespace: cilium
spec:
  interval: 24h
  layerSelector:
    mediaType: "application/vnd.cncf.helm.chart.content.v1.tar+gzip"
    operation: copy
  url: oci://quay.io/cilium/charts/cilium
  ref:
    # Pinned: Cilium >= 1.19.3 needs kernel BTF (CONFIG_DEBUG_INFO_BTF), which Raspberry Pi kernels don't ship.
    # See https://github.com/cilium/cilium/pull/46063
    digest: sha256:5e5f48bb9f09d9db0d5f4aa03a6a0b3c983315d46f0d6a8345269ac99eda5fcd # version 1.19.2+5e5f48bb9f09
#  verify:
#    provider: cosign
#    matchOIDCIdentity:
#      - issuer: "^https://token.actions.githubusercontent.com$"
#        subject: "^https://github.com/cilium/cilium/.*$"
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: cilium
  namespace: cilium
spec:
  releaseName: cilium
  chartRef:
    kind: OCIRepository
    name: cilium
  interval: 1h
  driftDetection:
    mode: enabled
  install:
    crds: CreateReplace
    strategy:
      name: RetryOnFailure
      retryInterval: 5m
  upgrade:
    crds: CreateReplace
    strategy:
      name: RetryOnFailure
      retryInterval: 5m
  valuesFrom:
    - kind: ConfigMap
      name: cilium-values
